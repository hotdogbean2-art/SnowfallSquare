name: SnowfallSquare
options:
  bundleIdPrefix: com.snowfallsquare
  deploymentTarget:
    iOS: "16.0"
targets:
  SnowfallSquare:
    type: application
    platform: iOS
    sources:
      - path: SnowfallSquare
    info:
      path: SnowfallSquare/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowfallsquare.game
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
